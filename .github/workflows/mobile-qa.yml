name: Mobile video check
on:
  push:
    branches: [main]
    paths: ["scripts/qa/**", ".github/workflows/mobile-qa.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/qa && cd /tmp/qa && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps webkit chromium >/dev/null
      - name: Run
        run: |
          sleep 60
          cp scripts/qa/mobile-video.mjs /tmp/qa/ && rm -rf assets-pipeline/mobile-qa
          cd /tmp/qa && node mobile-video.mjs; cp -r "$GITHUB_WORKSPACE/assets-pipeline/mobile-qa" . 2>/dev/null || true
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
      - name: Commit
        if: always()
        run: |
          [ -d /tmp/qa/assets-pipeline/mobile-qa ] && rm -rf assets-pipeline/mobile-qa && cp -r /tmp/qa/assets-pipeline/mobile-qa assets-pipeline/
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A assets-pipeline/mobile-qa || true
          git commit -m "Mobile video check [skip ci]" || exit 0
          git pull --rebase -q origin main && git push
