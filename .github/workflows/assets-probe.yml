name: assets-probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/assets-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe network
        run: |
          mkdir -p assets-pipeline
          {
            echo "ran: $(date -u)"
            for u in https://huggingface.co https://images.unsplash.com https://export-download.canva.com https://registry.npmjs.org; do
              echo "$u $(curl -s -o /dev/null -m 15 -w '%{http_code}' $u)"
            done
            node --version; nproc; free -g | head -2
          } > assets-pipeline/probe.log 2>&1
      - name: Commit result
        run: |
          git config user.name "assets-bot"
          git config user.email "assets-bot@users.noreply.github.com"
          git add assets-pipeline/probe.log
          git commit -m "Asset pipeline probe result [skip ci]" || exit 0
          git push
