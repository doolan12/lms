name: Keep the database awake
# Supabase's free plan pauses a project after 7 days without activity.
# Loading the course page queries the database, which counts as activity.
on:
  schedule:
    - cron: "17 21 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in "" "courses/forklift-licence-theory"; do
            curl -s -o /dev/null -w "$p %{http_code}\n" "https://lms-bay-rho.vercel.app/$p?keepalive=$RANDOM"
          done
