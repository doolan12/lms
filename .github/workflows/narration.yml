name: Record video narration
on:
  push:
    branches: [main]
    paths:
      - "src/content/videos/modules-*.ts"
      - "scripts/narration/**"
      - ".github/workflows/narration.yml"
permissions:
  contents: write
concurrency:
  group: narration
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install voice tools
        run: |
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          mkdir -p /tmp/tts && cd /tmp/tts && npm init -y >/dev/null && npm install --no-audit --no-fund kokoro-js@1.2.1
      - name: Record new lines
        run: |
          mkdir -p assets-pipeline
          node --experimental-strip-types scripts/narration/manifest.mts > /tmp/narration.json
          cp scripts/narration/generate.mjs /tmp/tts/generate.mjs
          node /tmp/tts/generate.mjs /tmp/narration.json 2>&1 | tee assets-pipeline/narration.log
        env:
          NARRATION_VOICE: af_heart
      - name: Save log on failure
        if: failure()
        run: echo "FAILED at $(date -u)" >> assets-pipeline/narration.log
      - name: Commit audio
        if: always()
        run: |
          git config user.name "narration-bot"
          git config user.email "narration-bot@users.noreply.github.com"
          git add -A public/audio src/content/videos/audio-manifest.json assets-pipeline/narration.log || true
          git commit -m "Record video narration (Kokoro, af_heart)" || exit 0
          git pull --rebase -q origin main
          git push
